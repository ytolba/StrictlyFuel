project_id = "strictlyfuel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "strictlyfuel://"
additional_redirect_urls = ["strictlyfuel://auth/callback"]

[storage]
enabled = true
file_size_limit = "12MiB"

[functions.search-foods]
verify_jwt = true

[functions.analyze-meal]
verify_jwt = true

[functions.analyze-food-label]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# RevenueCat cannot present a Supabase JWT; the shared secret guards this one.
[functions.revenuecat-webhook]
verify_jwt = false
